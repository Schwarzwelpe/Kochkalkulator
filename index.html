function base64UrlEncode(buffer) {
  var bytes = new Uint8Array(buffer);
  var str = "";
  for (var i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function sha256(plain) {
  var data = new TextEncoder().encode(plain);
  return window.crypto.subtle.digest("SHA-256", data);
}
function randomString(len) {
  var arr = new Uint8Array(len);
  window.crypto.getRandomValues(arr);
  return base64UrlEncode(arr.buffer).slice(0, len);
}

function startDropboxLogin() {
  var verifier = randomString(64);
  sessionStorage.setItem("dbx_verifier", verifier);
  sha256(verifier).then(function (hash) {
    var challenge = base64UrlEncode(hash);
    var params = new URLSearchParams({
      client_id: DROPBOX_APP_KEY,
      redirect_uri: REDIRECT_URI,
      response_type: "code",
      code_challenge: challenge,
      code_challenge_method: "S256",
      token_access_type: "offline"
    });
    window.location.href = "https://www.dropbox.com/oauth2/authorize?" + params.toString();
  });
}

function exchangeCodeForToken(code) {
  var verifier = sessionStorage.getItem("dbx_verifier");
  var params = new URLSearchParams({
    code: code,
    grant_type: "authorization_code",
    client_id: DROPBOX_APP_KEY,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  return fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params.toString()
  }).then(function (res) {
    if (!res.ok) throw new Error("Token-Austausch fehlgeschlagen: " + res.status);
    return res.json();
  });
}

function refreshAccessToken(refreshToken) {
  var params = new URLSearchParams({
    grant_type: "refresh_token",
    refresh_token: refreshToken,
    client_id: DROPBOX_APP_KEY
  });
  return fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params.toString()
  }).then(function (res) {
    if (!res.ok) throw new Error("Token-Refresh fehlgeschlagen: " + res.status);
    return res.json();
  });
}

function saveTokens(tokens) {
  var old = {};
  try { old = JSON.parse(localStorage.getItem("dbx_tokens") || "{}"); } catch (e) {}
  var stored = {
    access_token: tokens.access_token,
    refresh_token: tokens.refresh_token || old.refresh_token,
    expires_at: Date.now() + tokens.expires_in * 1000
  };
  localStorage.setItem("dbx_tokens", JSON.stringify(stored));
  return stored;
}
function loadTokens() {
  try { return JSON.parse(localStorage.getItem("dbx_tokens")); } catch (e) { return null; }
}
function clearTokens() { localStorage.removeItem("dbx_tokens"); }

function getValidAccessToken() {
  var tokens = loadTokens();
  if (!tokens) return Promise.resolve(null);
  if (Date.now() < tokens.expires_at - 60000) return Promise.resolve(tokens.access_token);
  return refreshAccessToken(tokens.refresh_token).then(function (fresh) {
    return saveTokens(fresh).access_token;
  });
}

function dbxDownload(accessToken, path) {
  return fetch("https://content.dropboxapi.com/2/files/download", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + accessToken,
      "Dropbox-API-Arg": JSON.stringify({ path: path })
    }
  }).then(function (res) {
    if (res.status === 409) return null;
    if (!res.ok) {
      return res.text().then(function (body) {
        throw new Error("Download fehlgeschlagen: " + res.status + " \u2014 " + body);
      });
    }
    return res.text();
  });
}

function dbxUpload(accessToken, path, content) {
  return fetch("https://content.dropboxapi.com/2/files/upload", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + accessToken,
      "Dropbox-API-Arg": JSON.stringify({ path: path, mode: "overwrite", mute: true }),
      "Content-Type": "application/octet-stream"
    },
    body: content
  }).then(function (res) {
    if (!res.ok) {
      return res.text().then(function (body) {
        throw new Error("Upload fehlgeschlagen: " + res.status + " \u2014 " + body);
      });
    }
    return res.json();
  });
}

function loadData() {
  return getValidAccessToken().then(function (accessToken) {
    if (!accessToken) throw new Error("Nicht angemeldet — bitte neu einloggen.");
    STATE.accessToken = accessToken;
    return dbxDownload(accessToken, DATA_FILE_PATH);
  }).then(function (text) {
    if (!text) {
      STATE.db = DEFAULT_DB.slice();
      STATE.recipes = DEFAULT_RECIPES.slice();
      STATE.toepfe = DEFAULT_TOEPFE.slice();
      return persistData();
    }
    var data = JSON.parse(text);
    STATE.db = data.db || DEFAULT_DB.slice();
    STATE.recipes = data.recipes || [];
    STATE.toepfe = data.toepfe || DEFAULT_TOEPFE.slice();
  });
}

function persistData() {
  var payload = JSON.stringify({ db: STATE.db, recipes: STATE.recipes, toepfe: STATE.toepfe, savedAt: new Date().toISOString() }, null, 2);
  return getValidAccessToken().then(function (accessToken) {
    if (!accessToken) throw new Error("Nicht angemeldet — bitte neu einloggen.");
    STATE.accessToken = accessToken;
    return dbxUpload(accessToken, DATA_FILE_PATH, payload);
  });
}

// ============ BERECHNUNG ============
function calcM(ing) {
  var g = pf(ing.grams) || 0;
  if (!g || !ing.dbId) return { kcal: 0, protein: 0, carbs: 0, fat: 0, leucin: 0 };
  var ref = STATE.db.find(function (e) { return e.id === ing.dbId; });
  if (!ref) return { kcal: 0, protein: 0, carbs: 0, fat: 0, leucin: 0 };
  var protein = g * ref.protein / 100;
  return {
    kcal: g * ref.kcal / 100,
    protein: protein,
    carbs: g * ref.carbs / 100,
    fat: g * ref.fat / 100,
    leucin: protein * (typeof ref.leu === "number" ? ref.leu : 0.065)
  };
}
function sumM(list) {
  return list.reduce(function (a, i) {
    var m = calcM(i);
    return { kcal: a.kcal + m.kcal, protein: a.protein + m.protein, carbs: a.carbs + m.carbs, fat: a.fat + m.fat, leucin: a.leucin + m.leucin };
  }, { kcal: 0, protein: 0, carbs: 0, fat: 0, leucin: 0 });
}

function renderIngRow(ing, cssClass) {

  var ref = ing.dbId ? STATE.db.find(function (e) { return e.id === ing.dbId; }) : null;

  var hasData = ing.grams && ing.dbId && ref;
  var showAnker = cssClass === "ing";
  var showShare = cssClass === "extra";
  var shared = showShare && !!ing.shared;
  var antS = window._antShared || 0;
  var gShare = shared ? (pf(ing.grams) || 0) * antS : (pf(ing.grams) || 0);
  if (shared) m = calcM({ dbId: ing.dbId, grams: gShare });
  var isAnker = showAnker && ing.dbId && STATE.activeAnkerDbId === ing.dbId;

  var html = '<div style="background:#0f1117;border:1px solid ' + (isAnker ? "#92610e" : "#1a2233") + ';border-radius:7px;padding:10px;margin-bottom:8px;">';
  html += '<div style="display:grid;grid-template-columns:' + (showAnker || showShare ? "28px 1fr 70px 32px" : "1fr 70px 32px") + ';gap:6px;align-items:center;">';
  if (showAnker) {
    html += '<button class="ingAnkerBtn" data-id="' + ing.id + '" title="Als Anker-Zutat markieren" style="background:' + (isAnker ? "#d97706" : "transparent") + ';border:1px solid #334155;border-radius:6px;color:' + (isAnker ? "#fff" : "#64748b") + ';height:36px;">\u2605</button>';
  }
  if (showShare) {
    html += '<button class="extraShareBtn" data-id="' + ing.id + '" title="In der Pfanne: wird mitgewogen und mit dem Anteil geteilt, verliert aber beim Einkochen kein Gewicht" style="background:' + (shared ? "#0e7490" : "transparent") + ';border:1px solid ' + (shared ? "#0e7490" : "#334155") + ';border-radius:6px;color:' + (shared ? "#fff" : "#64748b") + ';height:36px;font-size:13px;">\u00f7</button>';
  }
  html += '<select class="' + cssClass + 'Select" data-id="' + ing.id + '" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:14px;padding:8px;">';
  html += '<option value="">-- Zutat --</option>';
  sortedDb.forEach(function (e) {
    html += '<option value="' + e.id + '"' + (ing.dbId === e.id ? " selected" : "") + '>' + esc(e.name) + '</option>';
  });
  html += '</select>';
  html += '<input class="' + cssClass + 'Grams" data-id="' + ing.id + '" type="text" inputmode="decimal" placeholder="Gramm" value="' + esc(ing.grams) + '" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:14px;padding:8px;width:100%;">';
  html += '<button class="' + cssClass + 'Rm" data-id="' + ing.id + '" style="background:transparent;border:1px solid #334155;border-radius:6px;color:#94a3b8;height:36px;">\u2715</button>';
  html += '</div>';
  if (hasData) {
    html += '<div style="margin-top:6px;font-size:11px;"><span style="color:#64748b;margin-right:8px;">' + ref.kcal + ' kcal/100g</span>' + macroLine(m) + '</div>';
  }
  if (shared && hasData) {
    var totG = pf(ing.grams) || 0;
    html += '<div style="font-size:11px;color:#7dd3fc;margin-top:4px;">\u00f7 in der Pfanne \u00b7 Du: ' + (Math.round(gShare * 10) / 10) + ' g \u00b7 Rest: ' + (Math.round((totG - gShare) * 10) / 10) + ' g</div>';
  }
  if (hasData && garFactor(ref) > 0) {
    var gf = garFactor(ref);
    html += '<div style="font-size:11px;color:#7dd3fc;margin-top:4px;">\u2248 ' + Math.round(pf(ing.grams) * gf) + ' g gekocht' + (shared ? ' (du \u2248 ' + Math.round(gShare * gf) + ' g)' : '') + '</div>';
  }
  if (isAnker) {
    html += '<div style="font-size:10px;color:#fbbf24;margin-top:4px;">\u2605 Anker-Zutat \u2014 \u00e4nderst du die Menge, skalieren alle anderen Zutaten unten automatisch mit.</div>';
  }
  html += '</div>';
  return html;
}

// ============ TAB: RECHNER ============
function renderRechner() {
  var totals = sumM(STATE.ings);
  var totalsExtras = sumM(STATE.extras);
  var rawG = STATE.ings.reduce(function (s, i) { return s + (pf(i.grams) || 0); }, 0);
  var panExtras = STATE.extras.filter(function (i) { return i.shared; });
  var plateOnlyExtras = STATE.extras.filter(function (i) { return !i.shared; });
  var panExtrasW = panExtras.reduce(function (s, i) {
    var f = garFactor(STATE.db.find(function (e) { return e.id === i.dbId; }));
    return s + (pf(i.grams) || 0) * (f > 0 ? f : 1);
  }, 0);
  var panExtrasTot = sumM(panExtras);
  var panTotals = { kcal: totals.kcal + panExtrasTot.kcal, protein: totals.protein + panExtrasTot.protein, carbs: totals.carbs + panExtrasTot.carbs, fat: totals.fat + panExtrasTot.fat, leucin: totals.leucin + panExtrasTot.leucin };
  var expectedPan = rawG + panExtrasW;

  var topfGewicht = STATE.selectedTopf ? (STATE.toepfe.find(function (t) { return t.id === STATE.selectedTopf; }) || {}).weight || 0 : 0;
  var endWN = STATE.taraMode ? Math.max(0, (pf(STATE.bruttoW) || 0) - topfGewicht) : (pf(STATE.endW) || 0);
  var hasGar = STATE.ings.some(function (i) { return i.dbId && garFactor(STATE.db.find(function (e) { return e.id === i.dbId; })) > 0; });
  var weightWarning = endWN > 0 && expectedPan > 0 && endWN >= expectedPan && !hasGar;

  window._antShared = 0;
  var html = '<div style="background:#151922;border:1px solid #1e2433;border-radius:10px;padding:12px;margin-bottom:12px;">';
  html += '<div style="font-size:11px;font-weight:600;color:#4ade80;margin-bottom:8px;">\u{1F525} Eingekochte Zutaten (Rohgewicht)</div>';
  STATE.ings.forEach(function (ing) { html += renderIngRow(ing, "ing"); });
  html += '<div style="background:#1e293b;border-radius:7px;padding:10px;margin-top:4px;">Roh gesamt: ' + Math.round(rawG) + ' g<br>' + macroLine(totals) + '</div>';
  if (totals.leucin > 0) html += leucinAmpel(totals.leucin);
  html += '<button id="addIngBtn" style="width:100%;margin-top:8px;background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:7px;padding:9px;">+ Zutat</button>';
  html += '</div>';

  html += '<div style="background:#151922;border:1px solid #1e2433;border-radius:10px;padding:12px;margin-bottom:12px;">';
  html += '<div style="font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:8px;">Fertiggewicht nach dem Kochen</div>';
  html += '<div style="display:flex;gap:3px;background:#0f1117;border-radius:9px;padding:3px;margin-bottom:10px;">';
  html += '<button id="modeNetto" style="flex:1;padding:7px;border:none;border-radius:7px;background:' + (!STATE.taraMode ? "#1e293b" : "transparent") + ';color:' + (!STATE.taraMode ? "#e2e8f0" : "#64748b") + ';font-size:12px;">Nettogewicht</button>';
  html += '<button id="modeTara" style="flex:1;padding:7px;border:none;border-radius:7px;background:' + (STATE.taraMode ? "#1e293b" : "transparent") + ';color:' + (STATE.taraMode ? "#e2e8f0" : "#64748b") + ';font-size:12px;">Topf + Inhalt</button>';
  html += '</div>';

  if (!STATE.taraMode) {
    html += '<input id="endWInput" type="text" inputmode="decimal" placeholder="z.B. 1200" value="' + esc(STATE.endW) + '" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:14px;padding:8px;width:100%;">';
  } else {
    html += '<div style="font-size:11px;color:#64748b;margin-bottom:4px;">Topf / Pfanne</div>';
    html += '<select id="topfSelect" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:14px;padding:8px;width:100%;margin-bottom:8px;">';
    html += '<option value="">-- Kein Topf --</option>';
    STATE.toepfe.forEach(function (t) {
      html += '<option value="' + t.id + '"' + (STATE.selectedTopf === t.id ? " selected" : "") + '>' + esc(t.name) + ' (' + t.weight + 'g)</option>';
    });
    html += '</select>';
    html += '<input id="bruttoWInput" type="text" inputmode="decimal" placeholder="Bruttogewicht (Topf + Inhalt)" value="' + esc(STATE.bruttoW) + '" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:14px;padding:8px;width:100%;">';
    if (topfGewicht > 0 && STATE.bruttoW) {
      html += '<div style="font-size:11px;color:#64748b;margin-top:4px;">Netto: ' + Math.round(endWN) + ' g (abzgl. ' + topfGewicht + 'g Topf)</div>';
    }
  }

  if (weightWarning) {
    html += '<div style="background:#2b1a0c;border:1px solid #92400e;color:#fdba74;border-radius:7px;padding:8px 12px;font-size:12px;margin-top:8px;">\u26a0 Fertiggewicht (' + Math.round(endWN) + 'g) \u2265 Rohgewicht (' + Math.round(expectedPan) + 'g). Bitte pr\u00fcfen.</div>';
  } else if (endWN > 0 && expectedPan > 0) {
    var chg = Math.round((endWN / expectedPan - 1) * 100);
    html += '<div style="font-size:10px;color:#64748b;margin-top:4px;">' + (chg >= 0 ? 'Gewichtszunahme (Quellung): +' + chg : 'Gewichtsverlust: ' + (-chg)) + '%' + (panExtras.length ? ' (Basis: Zutaten ' + Math.round(rawG) + ' g + Pfannen-Beilagen gekocht ' + Math.round(panExtrasW) + ' g)' : '') + '</div>';
  }

  if (endWN > 0 && panTotals.kcal > 0) {
    var per100 = { kcal: panTotals.kcal / endWN * 100, protein: panTotals.protein / endWN * 100, carbs: panTotals.carbs / endWN * 100, fat: panTotals.fat / endWN * 100 };
    html += '<div style="font-size:11px;color:#475569;margin-top:8px;font-family:monospace;">' + Math.round(per100.kcal) + ' kcal \u00b7 ' + per100.protein.toFixed(1) + 'P \u00b7 ' + per100.carbs.toFixed(1) + 'KH \u00b7 ' + per100.fat.toFixed(1) + 'F pro 100g</div>';

    html += '<div style="margin-top:12px;font-size:10px;text-transform:uppercase;color:#64748b;">Meine Portion aus dem Topf</div>';
    html += '<div style="display:flex;gap:3px;background:#0f1117;border-radius:9px;padding:3px;margin:6px 0;">';
    html += '<button id="pModeGrams" style="flex:1;padding:6px;border:none;border-radius:7px;background:' + (STATE.pMode === "grams" ? "#1e293b" : "transparent") + ';color:' + (STATE.pMode === "grams" ? "#e2e8f0" : "#64748b") + ';font-size:11px;">X Gramm</button>';
    html += '<button id="pModeKcal" style="flex:1;padding:6px;border:none;border-radius:7px;background:' + (STATE.pMode === "kcal" ? "#1e293b" : "transparent") + ';color:' + (STATE.pMode === "kcal" ? "#e2e8f0" : "#64748b") + ';font-size:11px;">X kcal frei</button>';
    html += '<button id="pModeAnteil" style="flex:1;padding:6px;border:none;border-radius:7px;background:' + (STATE.pMode === "anteil" ? "#1e293b" : "transparent") + ';color:' + (STATE.pMode === "anteil" ? "#e2e8f0" : "#64748b") + ';font-size:11px;">X Anteil</button>';
    html += '</div>';
    html += '<input id="pInputField" type="text" inputmode="decimal" placeholder="' + (STATE.pMode === "anteil" ? "z.B. 0.7" : "z.B. 600") + '" value="' + esc(STATE.pInput) + '" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:14px;padding:8px;width:100%;">';

    var val = pf(STATE.pInput) || 0;
    var pg = STATE.pMode === "grams" ? val : STATE.pMode === "kcal" ? (per100.kcal > 0 ? val / (per100.kcal / 100) : 0) : (val * endWN);
    var ant = endWN > 0 ? Math.min(pg / endWN, 1) : 0;
    var portion = { kcal: panTotals.kcal * ant, protein: panTotals.protein * ant, carbs: panTotals.carbs * ant, fat: panTotals.fat * ant, leucin: panTotals.leucin * ant };
    var pgCapped = Math.min(pg, endWN);
    var anteilVal = endWN > 0 ? pgCapped / endWN : 0;
    html += '<div style="background:#0f1117;border-radius:8px;padding:10px;margin-top:8px;"><div style="font-size:10px;color:#4ade80;margin-bottom:4px;">\u{1F525} Aus dem Topf — ' + Math.round(pgCapped) + ' g · Anteil ' + anteilVal.toFixed(2) + '</div>' + macroLine(portion) + '</div>';
    if (pg > endWN) {
      html += '<div style="font-size:10px;color:#fdba74;margin-top:4px;">⚠ Gewünschte Menge entspricht ' + Math.round(pg) + 'g — mehr als die ' + Math.round(endWN) + 'g im Topf. Portion auf 100% des Topfs begrenzt.</div>';
    }

    window._portionCache = portion;
    window._antShared = ant;
  } else {
    window._portionCache = null;
    if (STATE.pMode === "anteil") window._antShared = Math.max(0, Math.min(pf(STATE.pInput) || 0, 1));
  }
  var plateExtras = sumM(plateOnlyExtras);
  var anyShared = STATE.extras.some(function (i) { return i.shared; });
  html += '</div>';

  // Extras / Beilagen
  html += '<div style="background:#151922;border:1px solid #2d3f1e;border-radius:10px;padding:12px;margin-bottom:12px;">';
  html += '<div style="font-size:11px;font-weight:600;color:#fb923c;margin-bottom:8px;">\u2728 Beilagen &amp; Extras (nicht eingekocht)</div>';
  if (STATE.extras.length === 0) {
    html += '<div style="font-size:12px;color:#475569;margin-bottom:8px;">z.B. Nudeln, Reis, Parmesan, Brot, Eier...</div>';
  }
  STATE.extras.forEach(function (ing) { html += renderIngRow(ing, "extra"); });
  if (STATE.extras.length > 0) {
    html += '<div style="background:#1e2b1a;border-radius:7px;padding:10px;margin-top:4px;">' + (anyShared ? 'Au\u00dferhalb der Pfanne (voll auf dem Teller)' : 'Beilagen gesamt') + '<br>' + macroLine(plateExtras) + '</div>';
  }
  html += '<button id="addExtraBtn" style="width:100%;margin-top:8px;background:transparent;border:1px solid #2d3f1e;color:#86efac;border-radius:7px;padding:9px;">+ Beilage</button>';
  html += '</div>';

  // Gesamt auf dem Teller
  if (window._portionCache) {
    var grand = {
      kcal: window._portionCache.kcal + plateExtras.kcal,
      protein: window._portionCache.protein + plateExtras.protein,
      carbs: window._portionCache.carbs + plateExtras.carbs,
      fat: window._portionCache.fat + plateExtras.fat,
      leucin: window._portionCache.leucin + plateExtras.leucin
    };
    html += '<div style="background:#0f1117;border:2px solid #334155;border-radius:10px;padding:16px;margin-bottom:12px;">';
    html += '<div style="font-size:13px;font-weight:600;color:#f1f5f9;margin-bottom:4px;">\u{1F4CA} Gesamt auf dem Teller</div>';
    html += macroPillsBig(grand);
    html += leucinAmpel(grand.leucin);
    html += '</div>';
  }

  html += renderGarConverter();

  html += '<div style="background:#1a1f2e;border:1px solid #2d3f5e;border-radius:10px;padding:12px;">';
  if (STATE.activeRecipeName) {
    html += '<div style="font-size:13px;color:#fb923c;font-weight:600;margin-bottom:8px;">\u{1F4CB} ' + esc(STATE.activeRecipeName) + '</div>';
  }
  html += '<div style="font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:8px;">Rezept speichern</div>';
  html += '<input id="recipeNameInput" type="text" placeholder="Rezeptname..." value="' + esc(STATE.activeRecipeName || "") + '" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:14px;padding:8px;width:100%;margin-bottom:8px;">';
  html += '<div style="display:flex;gap:8px;">';
  html += '<button id="saveRecipeBtn" style="flex:1;background:#d97706;color:#fff;border:none;border-radius:7px;padding:10px;font-weight:500;">' + (STATE.saving ? "Speichert..." : "\u{1F4BE} Speichern") + '</button>';
  html += '<button id="resetBtn" style="background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:7px;padding:10px 14px;">\u21ba Reset</button>';
  html += '</div>';
  html += '<div id="saveMsg" style="font-size:12px;margin-top:8px;"></div>';
  html += '</div>';

  document.getElementById("tabContent").innerHTML = html;
  wireRechnerEvents();
}

function renderGarConverter() {
  var gar = STATE.db.filter(function (e) { return garFactor(e) > 0; });
  if (gar.length === 0) return "";
  var inRecipe = {};
  STATE.ings.concat(STATE.extras).forEach(function (i) { if (i.dbId) inRecipe[i.dbId] = true; });
  var garIn = gar.filter(function (e) { return inRecipe[e.id]; });
  var garOut = gar.filter(function (e) { return !inRecipe[e.id]; });
  var ordered = garIn.concat(garOut);
  var sel = ordered.find(function (e) { return String(e.id) === String(STATE.garSel); }) || ordered[0];
  var f = garFactor(sel);
  var v = STATE.garVal;
  var roh, gek;
  if (STATE.garSide === "roh") { roh = v; gek = pf(v) > 0 ? String(Math.round(pf(v) * f)) : ""; }
  else { gek = v; roh = pf(v) > 0 ? String(Math.round(pf(v) / f * 10) / 10) : ""; }
  var inp = 'style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:14px;padding:8px;width:100%;"';
  var html = '<div style="background:#151922;border:1px solid #1e3a4a;border-radius:10px;padding:12px;margin-bottom:12px;">';
  html += '<div style="font-size:11px;font-weight:600;color:#7dd3fc;margin-bottom:8px;">\u2696\ufe0f Roh \u2194 Gekocht</div>';
  html += '<select id="garSelect" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:14px;padding:8px;width:100%;margin-bottom:8px;">';
  function garOpt(e) { return '<option value="' + e.id + '"' + (e.id === sel.id ? " selected" : "") + '>' + esc(e.name) + '</option>'; }
  if (garIn.length && garOut.length) {
    html += '<optgroup label="In diesem Rezept">' + garIn.map(garOpt).join("") + '</optgroup>';
    html += '<optgroup label="Weitere">' + garOut.map(garOpt).join("") + '</optgroup>';
  } else { ordered.forEach(function (e) { html += garOpt(e); }); }
  html += '</select>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
  html += '<div><div style="font-size:10px;color:#64748b;margin-bottom:3px;">Roh (Yazio) g</div><input id="garRohInput" type="text" inputmode="decimal" value="' + esc(roh) + '" ' + inp + '></div>';
  html += '<div><div style="font-size:10px;color:#64748b;margin-bottom:3px;">Gekocht (Teller) g</div><input id="garGekInput" type="text" inputmode="decimal" value="' + esc(gek) + '" ' + inp + '></div>';
  html += '</div>';
  var info = 'Faktor ' + f.toFixed(2).replace(".", ",") + '\u00d7 (' + pf(sel.garRoh) + ' g roh \u2192 ' + pf(sel.garGekocht) + ' g gekocht';
  if (sel.garDatum) info += ', verifiziert ' + esc(sel.garDatum);
  info += ')';
  html += '<div style="font-size:10px;color:#64748b;margin-top:6px;">' + info + ' \u00b7 ' + Math.round(sel.kcal / f) + ' kcal/100g gekocht</div>';
  if (sel.garHinweis) html += '<div style="font-size:10px;color:#94a3b8;margin-top:3px;">' + esc(sel.garHinweis) + '</div>';
  html += '</div>';
  return html;
}

function refocus(selector, cursorPos) {
  var el = document.querySelector(selector);
  if (el) { el.focus(); if (typeof cursorPos === "number") el.setSelectionRange(cursorPos, cursorPos); }
}

function wireRechnerEvents() {
  document.querySelectorAll(".ingSelect").forEach(function (sel) {
    sel.addEventListener("change", function () {
      var ing = STATE.ings.find(function (i) { return i.id === sel.dataset.id; });
      ing.dbId = sel.value ? parseInt(sel.value, 10) : null;
      renderRechner();
    });
  });
  document.querySelectorAll(".extraSelect").forEach(function (sel) {
    sel.addEventListener("change", function () {
      var ing = STATE.extras.find(function (i) { return i.id === sel.dataset.id; });
      ing.dbId = sel.value ? parseInt(sel.value, 10) : null;
      renderRechner();
    });
  });
  document.querySelectorAll(".ingAnkerBtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var ing = STATE.ings.find(function (i) { return i.id === btn.dataset.id; });
      if (!ing || !ing.dbId) return;
      if (STATE.activeAnkerDbId === ing.dbId) {
        STATE.activeAnkerDbId = null;
        STATE.ingsBaseline = null;
      } else {
        STATE.activeAnkerDbId = ing.dbId;
        STATE.ingsBaseline = STATE.ings.map(function (i) { return { dbId: i.dbId, grams: pf(i.grams) || 0 }; });
      }
      renderRechner();
    });
  });
  document.querySelectorAll(".ingGrams").forEach(function (inp) {
    inp.addEventListener("input", function () {
      var ing = STATE.ings.find(function (i) { return i.id === inp.dataset.id; });
      ing.grams = inp.value;
      var cursorPos = inp.selectionStart;
      if (STATE.activeAnkerDbId && STATE.ingsBaseline && ing.dbId === STATE.activeAnkerDbId) {
        var baseEntry = STATE.ingsBaseline.find(function (b) { return b.dbId === STATE.activeAnkerDbId; });
        var baseAmount = baseEntry ? baseEntry.grams : 0;
        var newAmount = pf(inp.value) || 0;
        var factor = baseAmount > 0 ? newAmount / baseAmount : 0;
        STATE.ings.forEach(function (i) {
          if (i.id === ing.id) return;
          var b = STATE.ingsBaseline.find(function (x) { return x.dbId === i.dbId; });
          if (b) i.grams = String(Math.round(b.grams * factor * 10) / 10);
        });
      }
      renderRechner();
      refocus('.ingGrams[data-id="' + ing.id + '"]', cursorPos);
    });
  });
  document.querySelectorAll(".extraGrams").forEach(function (inp) {
    inp.addEventListener("input", function () {
      var ing = STATE.extras.find(function (i) { return i.id === inp.dataset.id; });
      ing.grams = inp.value;
      var cursorPos = inp.selectionStart;
      renderRechner();
      refocus('.extraGrams[data-id="' + ing.id + '"]', cursorPos);
    });
  });
  document.querySelectorAll(".ingRm").forEach(function (btn) {
    btn.addEventListener("click", function () {
      STATE.ings = STATE.ings.filter(function (i) { return i.id !== btn.dataset.id; });
      if (STATE.ings.length === 0) STATE.ings = [{ id: cuid(), dbId: null, grams: "" }];
      renderRechner();
    });
  });
  document.querySelectorAll(".extraShareBtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var ing = STATE.extras.find(function (i) { return i.id === btn.dataset.id; });
      ing.shared = !ing.shared;
      renderRechner();
    });
  });
  document.querySelectorAll(".extraRm").forEach(function (btn) {
    btn.addEventListener("click", function () {
      STATE.extras = STATE.extras.filter(function (i) { return i.id !== btn.dataset.id; });
      renderRechner();
    });
  });
  var addBtn = document.getElementById("addIngBtn");
  if (addBtn) addBtn.addEventListener("click", function () { STATE.ings.push({ id: cuid(), dbId: null, grams: "" }); renderRechner(); });
  var addExtraBtn = document.getElementById("addExtraBtn");
  if (addExtraBtn) addExtraBtn.addEventListener("click", function () { STATE.extras.push({ id: cuid(), dbId: null, grams: "" }); renderRechner(); });

  var modeNetto = document.getElementById("modeNetto");
  if (modeNetto) modeNetto.addEventListener("click", function () { STATE.taraMode = false; renderRechner(); });
  var modeTara = document.getElementById("modeTara");
  if (modeTara) modeTara.addEventListener("click", function () { STATE.taraMode = true; renderRechner(); });

  var endWInput = document.getElementById("endWInput");
  if (endWInput) endWInput.addEventListener("input", function () {
    STATE.endW = endWInput.value;
    var cursorPos = endWInput.selectionStart;
    renderRechner();
    refocus("#endWInput", cursorPos);
  });
  var topfSelect = document.getElementById("topfSelect");
  if (topfSelect) topfSelect.addEventListener("change", function () { STATE.selectedTopf = topfSelect.value; renderRechner(); });
  var bruttoWInput = document.getElementById("bruttoWInput");
  if (bruttoWInput) bruttoWInput.addEventListener("input", function () {
    STATE.bruttoW = bruttoWInput.value;
    var cursorPos = bruttoWInput.selectionStart;
    renderRechner();
    refocus("#bruttoWInput", cursorPos);
  });

  var pModeGrams = document.getElementById("pModeGrams");
  if (pModeGrams) pModeGrams.addEventListener("click", function () { STATE.pMode = "grams"; renderRechner(); });
  var pModeKcal = document.getElementById("pModeKcal");
  if (pModeKcal) pModeKcal.addEventListener("click", function () { STATE.pMode = "kcal"; renderRechner(); });
  var garSelectEl = document.getElementById("garSelect");
  if (garSelectEl) garSelectEl.addEventListener("change", function () { STATE.garSel = garSelectEl.value; renderRechner(); });
  var garRohEl = document.getElementById("garRohInput");
  if (garRohEl) garRohEl.addEventListener("input", function () {
    STATE.garVal = garRohEl.value; STATE.garSide = "roh";
    var pos = garRohEl.selectionStart; renderRechner(); refocus("#garRohInput", pos);
  });
  var garGekEl = document.getElementById("garGekInput");
  if (garGekEl) garGekEl.addEventListener("input", function () {
    STATE.garVal = garGekEl.value; STATE.garSide = "gekocht";
    var pos = garGekEl.selectionStart; renderRechner(); refocus("#garGekInput", pos);
  });
  var pModeAnteil = document.getElementById("pModeAnteil");
  if (pModeAnteil) pModeAnteil.addEventListener("click", function () { STATE.pMode = "anteil"; renderRechner(); });

  var pInputField = document.getElementById("pInputField");
  if (pInputField) pInputField.addEventListener("input", function () {
    STATE.pInput = pInputField.value;
    var cursorPos = pInputField.selectionStart;
    renderRechner();
    refocus("#pInputField", cursorPos);
  });

  var resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", function () {
    STATE.ings = [{ id: cuid(), dbId: null, grams: "" }];
    STATE.extras = [];
    STATE.endW = ""; STATE.bruttoW = ""; STATE.taraMode = false; STATE.selectedTopf = "";
    STATE.pInput = "600"; STATE.pMode = "grams"; STATE.activeRecipeName = null;
    STATE.activeAnkerDbId = null; STATE.ingsBaseline = null;
    renderRechner();
  });

  var saveBtn = document.getElementById("saveRecipeBtn");
  if (saveBtn) saveBtn.addEventListener("click", function () {
    var nameInput = document.getElementById("recipeNameInput");
    var name = nameInput.value.trim();
    var msgEl = document.getElementById("saveMsg");
    if (!name) { msgEl.textContent = "Bitte Rezeptname eingeben."; msgEl.style.color = "#fdba74"; return; }

    var existing = STATE.recipes.find(function (r) { return r.name.toLowerCase() === name.toLowerCase(); });
    var topfGewicht = STATE.selectedTopf ? (STATE.toepfe.find(function (t) { return t.id === STATE.selectedTopf; }) || {}).weight || 0 : 0;
    var endWN = STATE.taraMode ? Math.max(0, (pf(STATE.bruttoW) || 0) - topfGewicht) : (pf(STATE.endW) || 0);
    var recipeData = {
      ingredients: STATE.ings.map(function (i) { return { dbId: i.dbId, grams: i.grams }; }),
      extras: STATE.extras.map(function (i) { var o = { dbId: i.dbId, grams: i.grams }; if (i.shared) o.shared = true; return o; }),
      endW: String(endWN || ""),
      taraMode: STATE.taraMode,
      selectedTopf: STATE.selectedTopf,
      bruttoW: STATE.bruttoW,
      pInput: STATE.pInput, pMode: STATE.pMode,
      ankerDbId: STATE.activeAnkerDbId || null,
      savedAt: new Date().toLocaleDateString("de-DE")
    };

    if (existing) { Object.assign(existing, recipeData); }
    else { STATE.recipes.unshift(Object.assign({ id: cuid(), name: name }, recipeData)); }

    STATE.activeRecipeName = name;
    STATE.saving = true;
    renderRechner();
    persistData().then(function () {
      STATE.saving = false;
      renderRechner();
      var m = document.getElementById("saveMsg");
      if (m) { m.textContent = '"' + name + '" gespeichert in Dropbox \u2705'; m.style.color = "#86efac"; }
    }).catch(function (e) {
      STATE.saving = false;
      renderRechner();
      var m = document.getElementById("saveMsg");
      if (m) { m.textContent = "Fehler: " + e.message; m.style.color = "#f87171"; }
    });
  });
}

// ============ TAB: REZEPTE ============
function recipePortionStats(r) {
  var rawTotals = sumM(r.ingredients);
  var rawG = r.ingredients.reduce(function (s, i) { return s + (pf(i.grams) || 0); }, 0);
  var endWN = pf(r.endW) || 0;

  var pe = sumM((r.extras || []).filter(function (i) { return i.shared; }));
  if (endWN > 0 && rawTotals.kcal > 0) {
    var per100 = { kcal: (rawTotals.kcal + pe.kcal) / endWN * 100, protein: (rawTotals.protein + pe.protein) / endWN * 100, carbs: (rawTotals.carbs + pe.carbs) / endWN * 100, fat: (rawTotals.fat + pe.fat) / endWN * 100 };
    var pMode = r.pMode || "grams";
    var val = pf(r.pInput) || 0;
    var pg = pMode === "grams" ? val : pMode === "kcal" ? (per100.kcal > 0 ? val / (per100.kcal / 100) : 0) : (val * endWN);
    var ant = Math.min(pg / endWN, 1);
    var extrasTotals = sumM((r.extras || []).filter(function (i) { return !i.shared; }));
    var big = {
      kcal: (rawTotals.kcal + pe.kcal) * ant + extrasTotals.kcal,
      protein: (rawTotals.protein + pe.protein) * ant + extrasTotals.protein,
      carbs: (rawTotals.carbs + pe.carbs) * ant + extrasTotals.carbs,
      fat: (rawTotals.fat + pe.fat) * ant + extrasTotals.fat,
      leucin: (rawTotals.leucin + pe.leucin) * ant + extrasTotals.leucin
    };
    var pgCappedR = Math.min(pg, endWN);
    var anteilR = endWN > 0 ? pgCappedR / endWN : 0;
    return { big: big, label: "Portion \u00b7 " + Math.round(pgCappedR) + "g \u00b7 Anteil " + anteilR.toFixed(2) };
  }
  if (rawG > 0 && rawTotals.kcal > 0) {
    var per100raw = {
      kcal: rawTotals.kcal / rawG * 100, protein: rawTotals.protein / rawG * 100,
      carbs: rawTotals.carbs / rawG * 100, fat: rawTotals.fat / rawG * 100, leucin: rawTotals.leucin / rawG * 100
    };
    return { big: per100raw, label: "pro 100g \u00b7 kein Fertiggewicht gespeichert" };
  }
  return { big: { kcal: 0, protein: 0, carbs: 0, fat: 0, leucin: 0 }, label: "keine Daten" };
}

function renderRezepte() {
  var html = "";
  if (STATE.recipes.length === 0) {
    html += '<div style="text-align:center;color:#64748b;padding:32px;">Noch keine Rezepte gespeichert.</div>';
  }
  STATE.recipes.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (r) {
    var stats = recipePortionStats(r);
    html += '<div style="background:#0f1117;border:1px solid #1e2433;border-radius:10px;padding:14px;margin-bottom:10px;">';
    html += '<div style="font-size:15px;font-weight:600;color:#f1f5f9;margin-bottom:2px;">' + esc(r.name) + '</div>';
    html += '<div style="font-size:10px;color:#64748b;margin-bottom:8px;">' + esc(stats.label) + '</div>';
    html += '<div style="font-family:monospace;font-size:34px;font-weight:700;color:#e2e8f0;line-height:1;">' + Math.round(stats.big.kcal) + '<span style="font-size:14px;color:#64748b;font-weight:400;"> kcal</span></div>';
    html += macroPillsBig(stats.big);
    html += leucinAmpel(stats.big.leucin);
    html += '<div style="display:flex;gap:6px;margin-top:10px;">';
    html += '<button class="loadRecipeBtn" data-id="' + r.id + '" style="flex:1;background:#3b82f6;color:#fff;border:none;border-radius:7px;padding:8px;font-size:12px;">\u{1F4C2} Laden</button>';
    html += '<button class="delRecipeBtn" data-id="' + r.id + '" style="background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:6px;width:32px;">\u2715</button>';
    html += '</div></div>';
  });
  document.getElementById("tabContent").innerHTML = html;

  document.querySelectorAll(".loadRecipeBtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var r = STATE.recipes.find(function (x) { return x.id === btn.dataset.id; });
      STATE.ings = r.ingredients.map(function (i) { return { id: cuid(), dbId: i.dbId, grams: i.grams }; });
      STATE.extras = (r.extras || []).map(function (i) { return { id: cuid(), dbId: i.dbId, grams: i.grams, shared: !!i.shared }; });
      STATE.endW = r.endW || "";
      STATE.pInput = r.pInput || "600";
      STATE.pMode = r.pMode || "grams";
      STATE.activeRecipeName = r.name;
      STATE.taraMode = !!r.taraMode;
      STATE.selectedTopf = r.taraMode ? (r.selectedTopf || "") : "";
      STATE.bruttoW = r.taraMode ? (r.bruttoW || "") : "";
      STATE.activeAnkerDbId = r.ankerDbId || null;
      STATE.ingsBaseline = STATE.ings.map(function (i) { return { dbId: i.dbId, grams: pf(i.grams) || 0 }; });
      STATE.tab = "rechner";
      renderApp();
    });
  });
  document.querySelectorAll(".delRecipeBtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (!confirm("Rezept wirklich l\u00f6schen?")) return;
      STATE.recipes = STATE.recipes.filter(function (r) { return r.id !== btn.dataset.id; });
      persistData().then(renderRezepte);
    });
  });
}

// ============ TAB: DATENBANK ============
function renderDatenbank() {
  var sortedDb = STATE.db.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
  var html = '<div style="background:#151922;border:1px solid #1e2433;border-radius:10px;padding:12px;margin-bottom:12px;">';
  html += '<div style="font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:8px;">Neues Lebensmittel</div>';
  html += '<input id="newFoodName" placeholder="Name" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;padding:8px;width:100%;margin-bottom:8px;">';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">';
  ["kcal", "protein", "carbs", "fat"].forEach(function (f) {
    html += '<input id="newFood_' + f + '" placeholder="' + f + ' /100g" inputmode="decimal" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;padding:8px;">';
  });
  html += '</div>';
  html += '<button id="addFoodBtn" style="width:100%;background:#059669;color:#fff;border:none;border-radius:7px;padding:10px;">+ Hinzuf\u00fcgen</button>';
  html += '</div>';

  html += '<div style="background:#151922;border:1px solid #1e2433;border-radius:10px;padding:12px;margin-bottom:12px;">';
  html += '<div style="font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:8px;">T\u00f6pfe &amp; Pfannen</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 90px 36px;gap:6px;margin-bottom:10px;align-items:end;">';
  html += '<div><div style="font-size:10px;color:#64748b;margin-bottom:3px;">Name</div><input id="newTopfName" placeholder="z.B. Suppentopf" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;padding:8px;width:100%;"></div>';
  html += '<div><div style="font-size:10px;color:#64748b;margin-bottom:3px;">Gewicht (g)</div><input id="newTopfWeight" inputmode="decimal" placeholder="1240" style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;padding:8px;width:100%;"></div>';
  html += '<button id="addTopfBtn" style="background:#059669;color:#fff;border:none;border-radius:7px;height:40px;">+</button>';
  html += '</div>';
  if (STATE.toepfe.length === 0) html += '<div style="font-size:12px;color:#475569;">Noch keine T\u00f6pfe eingetragen.</div>';
  STATE.toepfe.forEach(function (t) {
    html += '<div style="display:grid;grid-template-columns:1fr auto 32px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #1e2433;">';
    html += '<span style="font-size:13px;">' + esc(t.name) + '</span>';
    html += '<span style="font-family:monospace;font-size:12px;color:#94a3b8;">' + t.weight + 'g</span>';
    html += '<button class="delTopfBtn" data-id="' + t.id + '" style="background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:6px;">\u2715</button>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div style="background:#151922;border:1px solid #1e2433;border-radius:10px;padding:12px;">';
  html += '<div style="font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:8px;">Lebensmittel (' + STATE.db.length + ')</div>';
  sortedDb.forEach(function (e) {
    var hasG = garFactor(e) > 0;
    html += '<div style="display:grid;grid-template-columns:1fr auto 28px 28px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #1e2433;font-size:12px;">';
    html += '<span>' + esc(e.name) + (hasG ? ' <span style="color:#7dd3fc;font-size:10px;">\u00d7' + garFactor(e).toFixed(2).replace(".", ",") + '</span>' : '') + '</span>';
    html += '<span style="font-family:monospace;font-size:10px;color:#94a3b8;">' + e.kcal + 'kcal \u00b7 ' + e.protein + 'P</span>';
    html += '<button class="garFoodBtn" data-id="' + e.id + '" title="Garfaktor" style="background:transparent;border:1px solid ' + (hasG ? '#0e7490' : '#334155') + ';color:' + (hasG ? '#7dd3fc' : '#94a3b8') + ';border-radius:5px;">\u2696</button>';
    html += '<button class="delFoodBtn" data-id="' + e.id + '" style="background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:5px;">\u2715</button>';
    html += '</div>';
    if (String(STATE.garEditId) === String(e.id)) {
      var gi = 'style="background:#0f1117;border:1px solid #1e2433;border-radius:7px;color:#e2e8f0;font-size:13px;padding:7px;width:100%;"';
      html += '<div style="background:#0f1722;border:1px solid #1e3a4a;border-radius:8px;padding:10px;margin:4px 0 8px;">';
      html += '<div style="font-size:10px;color:#7dd3fc;margin-bottom:6px;">Garfaktor (roh \u2192 gekocht)</div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px;">';
      html += '<input id="garE_roh" inputmode="decimal" placeholder="roh g" value="' + (e.garRoh || "") + '" ' + gi + '>';
      html += '<input id="garE_gek" inputmode="decimal" placeholder="gekocht g" value="' + (e.garGekocht || "") + '" ' + gi + '>';
      html += '<input id="garE_dat" placeholder="dd.mm.yyyy" value="' + esc(e.garDatum || todayDE()) + '" ' + gi + '>';
      html += '</div>';
      html += '<input id="garE_hint" placeholder="Hinweis (z.B. 100 g Nudeln auf 1 L Wasser, abgie\u00dfen)" value="' + esc(e.garHinweis || "") + '" ' + gi + ' style="margin-bottom:6px;">';
      html += '<div style="display:flex;gap:6px;margin-top:6px;">';
      html += '<button id="garE_save" style="flex:1;background:#059669;color:#fff;border:none;border-radius:7px;padding:8px;">Speichern</button>';
      html += '<button id="garE_clear" style="background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:7px;padding:8px;">Entfernen</button>';
      html += '<button id="garE_cancel" style="background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:7px;padding:8px;">Abbrechen</button>';
      html += '</div></div>';
    }
  });
  html += '</div>';

  document.getElementById("tabContent").innerHTML = html;

  document.getElementById("addFoodBtn").addEventListener("click", function () {
    var name = document.getElementById("newFoodName").value.trim();
    var kcal = pf(document.getElementById("newFood_kcal").value);
    if (!name || isNaN(kcal)) { alert("Name und kcal sind Pflicht (0 ist erlaubt, z.B. bei Wasser)."); return; }
    var nums = STATE.db.map(function (e) { return e.num || 0; });
    var nextNum = nums.length ? Math.max.apply(null, nums) + 1 : 1;
    STATE.db.push({
      id: Date.now(), num: nextNum, name: name, kcal: kcal,
      protein: pf(document.getElementById("newFood_protein").value) || 0,
      carbs: pf(document.getElementById("newFood_carbs").value) || 0,
      fat: pf(document.getElementById("newFood_fat").value) || 0,
      leu: 0.065
    });
    persistData().then(renderDatenbank);
  });
  document.querySelectorAll(".garFoodBtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      STATE.garEditId = String(STATE.garEditId) === btn.dataset.id ? null : btn.dataset.id;
      renderDatenbank();
    });
  });
  var garSave = document.getElementById("garE_save");
  if (garSave) {
    var editItem = STATE.db.find(function (e) { return String(e.id) === String(STATE.garEditId); });
    garSave.addEventListener("click", function () {
      var r = pf(document.getElementById("garE_roh").value), g = pf(document.getElementById("garE_gek").value);
      if (!(r > 0) || !(g > 0)) { alert("Roh- und Gekocht-Gewicht m\u00fcssen > 0 sein."); return; }
      editItem.garRoh = r; editItem.garGekocht = g;
      editItem.garDatum = document.getElementById("garE_dat").value.trim() || todayDE();
      var h = document.getElementById("garE_hint").value.trim();
      if (h) editItem.garHinweis = h; else delete editItem.garHinweis;
      STATE.garEditId = null;
      persistData().then(renderDatenbank);
    });
    document.getElementById("garE_clear").addEventListener("click", function () {
      delete editItem.garRoh; delete editItem.garGekocht; delete editItem.garDatum; delete editItem.garHinweis;
      STATE.garEditId = null;
      persistData().then(renderDatenbank);
    });
    document.getElementById("garE_cancel").addEventListener("click", function () { STATE.garEditId = null; renderDatenbank(); });
  }
  document.querySelectorAll(".delFoodBtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      STATE.db = STATE.db.filter(function (e) { return e.id !== parseInt(btn.dataset.id, 10); });
      persistData().then(renderDatenbank);
    });
  });
  document.getElementById("addTopfBtn").addEventListener("click", function () {
    var name = document.getElementById("newTopfName").value.trim();
    var weight = pf(document.getElementById("newTopfWeight").value);
    if (!name || !weight) { alert("Name und Gewicht sind Pflicht."); return; }
    STATE.toepfe.push({ id: cuid(), name: name, weight: weight });
    persistData().then(renderDatenbank);
  });
  document.querySelectorAll(".delTopfBtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      STATE.toepfe = STATE.toepfe.filter(function (t) { return t.id !== btn.dataset.id; });
      persistData().then(renderDatenbank);
    });
  });
}

function init() {
  var urlParams = new URLSearchParams(window.location.search);
  var code = urlParams.get("code");

  if (code) {
    exchangeCodeForToken(code).then(function (tokens) {
      saveTokens(tokens);
      window.history.replaceState({}, "", REDIRECT_URI);
      renderMainApp(tokens.access_token);
    }).catch(function (e) {
      showError("Login fehlgeschlagen:", e.message);
    });
    return;
  }

  getValidAccessToken().then(function (token) {
    if (token) renderMainApp(token);
    else renderLogin();
  }).catch(function (e) {
    showError("Fehler beim Pr\u00fcfen des Logins:", e.message);
  });
}

init();
