<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Rod's Kochkalkulator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e2e8f0; font-family: 'Inter', sans-serif; font-size: 14px; }
  #root { min-height: 100vh; }
  .login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; text-align:center; }
  .login-btn { background:#0061fe; color:#fff; border:none; border-radius:8px; padding:14px 24px; font-size:15px; font-weight:600; cursor:pointer; margin-top:20px; }
  .status-text { color:#64748b; font-size:13px; margin-top:12px; }
  .err-box { color:#f87171; max-width:500px; word-break:break-word; }
</style>
</head>
<body>
<div id="root">
  <div class="login-screen"><div>Lade App...</div></div>
</div>

<script>
"use strict";

function showError(title, detail) {
  document.getElementById("root").innerHTML =
    '<div class="login-screen"><div class="err-box"><strong>' + title + '</strong><br>' + detail + '</div></div>';
}
window.addEventListener("error", function (e) {
  showError("Fehler beim Laden:", (e.message || "Unbekannter Fehler") + "<br>Zeile: " + (e.lineno || "?"));
});
window.addEventListener("unhandledrejection", function (e) {
  showError("Fehler (Promise):", e.reason && e.reason.message ? e.reason.message : String(e.reason));
});

var DROPBOX_APP_KEY = "nns9uy3os0aolu9";
var REDIRECT_URI = window.location.origin + window.location.pathname;
var DATA_FILE_PATH = "/kochkalkulator-daten.json";

function base64UrlEncode(buffer) {
  var bytes = new Uint8Array(buffer);
  var str = "";
  for (var i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function sha256(plain) {
  var data = new TextEncoder().encode(plain);
  return window.crypto.subtle.digest("SHA-256", data);
}
function randomString(len) {
  var arr = new Uint8Array(len);
  window.crypto.getRandomValues(arr);
  return base64UrlEncode(arr.buffer).slice(0, len);
}

function startDropboxLogin() {
  var verifier = randomString(64);
  sessionStorage.setItem("dbx_verifier", verifier);
  sha256(verifier).then(function (hash) {
    var challenge = base64UrlEncode(hash);
    var params = new URLSearchParams({
      client_id: DROPBOX_APP_KEY,
      redirect_uri: REDIRECT_URI,
      response_type: "code",
      code_challenge: challenge,
      code_challenge_method: "S256",
      token_access_type: "offline"
    });
    window.location.href = "https://www.dropbox.com/oauth2/authorize?" + params.toString();
  });
}

function exchangeCodeForToken(code) {
  var verifier = sessionStorage.getItem("dbx_verifier");
  var params = new URLSearchParams({
    code: code,
    grant_type: "authorization_code",
    client_id: DROPBOX_APP_KEY,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  return fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params.toString()
  }).then(function (res) {
    if (!res.ok) throw new Error("Token-Austausch fehlgeschlagen: " + res.status);
    return res.json();
  });
}

function refreshAccessToken(refreshToken) {
  var params = new URLSearchParams({
    grant_type: "refresh_token",
    refresh_token: refreshToken,
    client_id: DROPBOX_APP_KEY
  });
  return fetch("https://api.dropboxapi.com/oauth2/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params.toString()
  }).then(function (res) {
    if (!res.ok) throw new Error("Token-Refresh fehlgeschlagen: " + res.status);
    return res.json();
  });
}

function saveTokens(tokens) {
  var old = {};
  try { old = JSON.parse(localStorage.getItem("dbx_tokens") || "{}"); } catch (e) {}
  var stored = {
    access_token: tokens.access_token,
    refresh_token: tokens.refresh_token || old.refresh_token,
    expires_at: Date.now() + tokens.expires_in * 1000
  };
  localStorage.setItem("dbx_tokens", JSON.stringify(stored));
  return stored;
}
function loadTokens() {
  try { return JSON.parse(localStorage.getItem("dbx_tokens")); } catch (e) { return null; }
}
function clearTokens() { localStorage.removeItem("dbx_tokens"); }

function getValidAccessToken() {
  var tokens = loadTokens();
  if (!tokens) return Promise.resolve(null);
  if (Date.now() < tokens.expires_at - 60000) return Promise.resolve(tokens.access_token);
  return refreshAccessToken(tokens.refresh_token).then(function (fresh) {
    return saveTokens(fresh).access_token;
  });
}

function dbxDownload(accessToken, path) {
  return fetch("https://content.dropboxapi.com/2/files/download", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + accessToken,
      "Dropbox-API-Arg": JSON.stringify({ path: path })
    }
  }).then(function (res) {
    if (res.status === 409) return null;
    if (!res.ok) throw new Error("Download fehlgeschlagen: " + res.status);
    return res.text();
  });
}

function dbxUpload(accessToken, path, content) {
  return fetch("https://content.dropboxapi.com/2/files/upload", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + accessToken,
      "Dropbox-API-Arg": JSON.stringify({ path: path, mode: "overwrite", mute: true }),
      "Content-Type": "application/octet-stream"
    },
    body: content
  }).then(function (res) {
    if (!res.ok) throw new Error("Upload fehlgeschlagen: " + res.status);
    return res.json();
  });
}

function renderLogin() {
  document.getElementById("root").innerHTML =
    '<div class="login-screen">' +
      '<div style="font-size:20px;font-weight:600;">\u{1F372} Rod\'s Kochkalkulator</div>' +
      '<div class="status-text">Verbinde dich mit Dropbox, um deine Rezepte zu speichern.</div>' +
      '<button class="login-btn" id="loginBtn">Mit Dropbox verbinden</button>' +
    '</div>';
  document.getElementById("loginBtn").addEventListener("click", startDropboxLogin);
}

function renderMainApp(accessToken) {
  document.getElementById("root").innerHTML =
    '<div style="padding:20px;">' +
      '<div style="font-size:18px;font-weight:600;margin-bottom:8px;">\u{1F372} Rod\'s Kochkalkulator</div>' +
      '<div class="status-text">Verbunden mit Dropbox \u2705</div>' +
      '<div style="margin-top:20px;color:#94a3b8;">Grundger\u00fcst steht: Login funktioniert, Verbindung zu Dropbox steht. Der eigentliche Rechner/Rezepte-Teil kommt im n\u00e4chsten Schritt oben drauf.</div>' +
      '<button class="login-btn" id="logoutBtn" style="background:#334155;margin-top:20px;">Abmelden</button>' +
    '</div>';
  document.getElementById("logoutBtn").addEventListener("click", function () {
    clearTokens();
    window.location.reload();
  });
}

function init() {
  var urlParams = new URLSearchParams(window.location.search);
  var code = urlParams.get("code");

  if (code) {
    exchangeCodeForToken(code).then(function (tokens) {
      saveTokens(tokens);
      window.history.replaceState({}, "", REDIRECT_URI);
      renderMainApp(tokens.access_token);
    }).catch(function (e) {
      showError("Login fehlgeschlagen:", e.message);
    });
    return;
  }

  getValidAccessToken().then(function (token) {
    if (token) renderMainApp(token);
    else renderLogin();
  }).catch(function (e) {
    showError("Fehler beim Pr\u00fcfen des Logins:", e.message);
  });
}

init();
</script>
</body>
</html>
